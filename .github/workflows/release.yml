name: Shell-Color public releases
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y rpm zstd zip shellcheck ripgrep
      - name: Verify tag
        run: test "$(echo "$GITHUB_REF_NAME" | sed s/^v//)" = "$(cat VERSION)"
      - name: Validate Linux, NetBSD and FreeBSD adapters
        run: make test-linux test-bsd lint
      - name: Linux and BSD distributions
        run: make tarball deb rpm arch && sh scripts/build-bsd-tarballs.sh
      - name: Windows ZIP
        run: zip -qr "dist/shell-color-$(cat VERSION)-windows.zip" windows docs Readme.md LICENCE.md VERSION
      - name: Checksums
        run: |
          cd dist
          for artifact in *; do
            if [ "$artifact" != SHA256SUMS ]; then
              sha256sum -- "$artifact"
            fi
          done > ../SHA256SUMS
          test -s ../SHA256SUMS
          mv -- ../SHA256SUMS SHA256SUMS
      - name: Publish public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
